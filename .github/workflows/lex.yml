name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lex-ocpp
        uses: actions/checkout@v4
        with:
          path: lex-ocpp

      # lex-ocpp's lex.toml resolves lex-schema + lex-web via
      # `path = "../sibling"`. CI runners don't have the siblings
      # pre-cloned, so we check them out next to lex-ocpp.
      - name: Checkout lex-schema (sibling)
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-schema
          path: lex-schema

      # lex-schema's main branch may not carry a lex.toml yet (PR in
      # flight); create a minimal one so pkg install succeeds.
      - name: Bootstrap lex-schema manifest (if missing)
        run: |
          if [ ! -f lex-schema/lex.toml ]; then
            printf '[package]\nname    = "lex-schema"\nversion = "0.1.0"\n\n[dependencies]\n' \
              > lex-schema/lex.toml
          fi

      - name: Checkout lex-web (sibling)
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-web
          path: lex-web

      - name: Install Lex toolchain
        run: |
          git clone --depth=1 --branch v0.9.3 https://github.com/alpibrusl/lex-lang /tmp/lex-lang
          cd /tmp/lex-lang && cargo build --release -p lex-cli
          echo "/tmp/lex-lang/target/release" >> $GITHUB_PATH

      - name: Install package dependencies
        working-directory: lex-ocpp
        run: lex pkg install

      # Pure entry point: covers messages.lex, route.lex, error.lex.
      - name: Type-check charge_point.lex (strict)
        working-directory: lex-ocpp
        run: lex check --strict src/charge_point.lex

      # Effectful entry point: covers route_io.lex, charge_point_io.lex.
      - name: Type-check charge_point_io.lex (strict)
        working-directory: lex-ocpp
        run: lex check --strict src/charge_point_io.lex

      - name: Type-check security.lex (strict)
        working-directory: lex-ocpp
        run: lex check --strict src/security.lex

      # Run the pure test suite. lex test discovers all test_*.lex files
      # in tests/ and handles crypto/time primitives correctly.
      - name: Test
        working-directory: lex-ocpp
        run: lex test

      # Effect-flavoured suite in tests/effectful/ -- kept separate
      # because lex test is non-recursive.
      - name: Run effectful test suite
        working-directory: lex-ocpp
        run: |
          out=$(lex run --allow-effects io,sql,time \
            tests/effectful/test_route_io.lex run_all)
          echo "test_route_io.lex: $out"
          [ "$out" = "0" ] || { echo "::error::test_route_io reported $out failure(s)"; exit 1; }

      # Belt-and-braces: every file under tools/ and examples/.
      - name: Type-check tools/ + examples/
        working-directory: lex-ocpp
        run: |
          set -e
          for f in $(find tools examples -name '*.lex' | sort); do
            echo "=== $f ==="
            lex check "$f"
          done

      - name: Smoke-run charger frame demo
        working-directory: lex-ocpp
        run: lex run --allow-effects io examples/charger_frames.lex main | head -10

      - name: Smoke-run codegen demo
        working-directory: lex-ocpp
        run: lex run tools/gen.lex demo | head -5
