name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned at scaffold time. Bump when you upgrade the toolchain.
  # lex 0.9.3 brings: net.dial_ws (outbound WS client, wss:// via rustls),
  # hyper 1.x server (5-8x throughput), permissive-policy fix for sql/random
  # effects in lex test (#399), list.cons tail-clone elimination.
  LEX_VERSION: v0.9.3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lex-ocpp
        uses: actions/checkout@v4
        with:
          path: lex-ocpp

      # lex-ocpp's lex.toml resolves lex-schema + lex-web via
      # `path = "../<sibling>"`. CI runners don't have the siblings
      # pre-cloned, so we check them out next to lex-ocpp.
      - name: Checkout lex-schema (sibling)
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-schema
          path: lex-schema

      # lex 0.9.3 validates path-dep manifests during pkg install.
      # lex-schema's main branch doesn't carry a lex.toml yet (PR in
      # flight); create a minimal one so pkg install succeeds. This step
      # is a no-op once that PR lands.
      - name: Bootstrap lex-schema manifest (if missing)
        run: |
          if [ ! -f lex-schema/lex.toml ]; then
            printf '[package]\nname    = "lex-schema"\nversion = "0.1.0"\n\n[dependencies]\n' \
              > lex-schema/lex.toml
          fi

      - name: Checkout lex-web (sibling)
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-web
          path: lex-web

      - name: Install Lex toolchain (pre-built binary)
        run: |
          set -euo pipefail
          TARGET=x86_64-unknown-linux-gnu
          URL="https://github.com/alpibrusl/lex-lang/releases/download/${LEX_VERSION}/lex-${LEX_VERSION}-${TARGET}.tar.gz"
          curl -sSfL "$URL" -o lex.tar.gz
          tar -xzf lex.tar.gz
          rm lex.tar.gz
          sudo install -m 0755 \
            "$(find . -maxdepth 2 -name 'lex' -type f -perm /111 | head -1)" \
            /usr/local/bin/lex
          lex --version

      - name: Install package dependencies
        working-directory: lex-ocpp
        run: lex pkg install

      # `lex ci` runs:
      #   pkg install -> check --strict src/ -> fmt --check src/ tests/
      #   -> test (every tests/test_*.lex; subdirs are ignored)
      #
      # `--no-fmt` until the generated source (tools/gen.lex emits
      # Lex fragments) and the v0.3 hand-written code have been
      # through `lex fmt` -- separate cleanup pass.
      - name: lex ci (pkg install + check --strict + test)
        working-directory: lex-ocpp
        run: lex ci --no-fmt

      # Effect-flavoured suite in tests/effectful/ -- kept separate
      # because lex ci's test runner is non-recursive. Now that #399
      # is fixed in 0.9.3, could fold into the main suite by moving
      # tests to tests/ and relying on Policy::permissive().
      - name: Run effectful test suite
        working-directory: lex-ocpp
        run: |
          out=$(lex run --allow-effects io,sql,time \
            tests/effectful/test_route_io.lex run_all)
          echo "test_route_io.lex: $out"
          [ "$out" = "0" ] || { echo "::error::test_route_io reported $out failure(s)"; exit 1; }

      # Belt-and-braces: every file under tools/ and examples/ that
      # `lex ci` doesn't reach should still type-check.
      - name: Type-check tools/ + examples/
        working-directory: lex-ocpp
        run: |
          set -e
          for f in $(find tools examples -name '*.lex' | sort); do
            echo "=== $f ==="
            lex check "$f"
          done

      - name: Smoke-run charger frame demo
        working-directory: lex-ocpp
        run: lex run --allow-effects io examples/charger_frames.lex main | head -10

      - name: Smoke-run codegen demo
        working-directory: lex-ocpp
        run: lex run tools/gen.lex demo | head -5
