name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lex-ocpp
        uses: actions/checkout@v4
        with:
          path: lex-ocpp

      # lex-ocpp's lex.toml resolves lex-schema + lex-web via
      # `path = "../↔sibling"". CI runners don't have the siblings
      # pre-cloned, so we check them out next to lex-ocpp.
      - name: Checkout lex-schema (sibling)
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-schema
          path: lex-schema

      # lex-schema's main branch may not carry a lex.toml yet (PR in
      # flight); create a minimal one so pkg install succeeds.
      - name: Bootstrap lex-schema manifest (if missing)
        run: |
          if [ ! -f lex-schema/lex.toml ]; then
            printf '[package]\nname    = "lex-schema"\nversion = "0.1.0"\n\n[dependencies]\n' \
              > lex-schema/lex.toml
          fi

      - name: Checkout lex-web (sibling)
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-web
          path: lex-web

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Lex toolchain (build from source)
        run: |
          git clone --depth=1 https://github.com/alpibrusl/lex-lang /tmp/lex-lang
          cd /tmp/lex-lang && cargo build --release -p lex-cli
          echo "/tmp/lex-lang/target/release" >> $GITHUB_PATH

      - name: Verify lex version
        run: lex --version

      - name: Install package dependencies
        working-directory: lex-ocpp
        run: lex pkg install

      # Pure entry point: covers messages.lex, route.lex, error.lex.
      - name: Type-check charge_point.lex (strict)
        working-directory: lex-ocpp
        run: lex check --strict src/charge_point.lex

      # Effectful entry point: covers route_io.lex, charge_point_io.lex.
      - name: Type-check charge_point_io.lex (strict)
        working-directory: lex-ocpp
        run: lex check --strict src/charge_point_io.lex

      - name: Type-check security.lex (strict)
        working-directory: lex-ocpp
        run: lex check --strict src/security.lex

      # Run each test file individually so failures are attributable.
      - name: Test test_error.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_error.lex run_all)
          echo "test_error.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_error reported $out failure(s)"; exit 1; }

      - name: Test test_messages.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_messages.lex run_all)
          echo "test_messages.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_messages reported $out failure(s)"; exit 1; }

      - name: Test test_route.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_route.lex run_all)
          echo "test_route.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_route reported $out failure(s)"; exit 1; }

      - name: Test test_gen.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_gen.lex run_all)
          echo "test_gen.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_gen reported $out failure(s)"; exit 1; }

      - name: Test test_v16_schemas.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_v16_schemas.lex run_all)
          echo "test_v16_schemas.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_v16_schemas reported $out failure(s)"; exit 1; }

      - name: Test test_v201_schemas.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_v201_schemas.lex run_all)
          echo "test_v201_schemas.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_v201_schemas reported $out failure(s)"; exit 1; }

      - name: Test test_v21_schemas.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_v21_schemas.lex run_all)
          echo "test_v21_schemas.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_v21_schemas reported $out failure(s)"; exit 1; }

      - name: Test test_security.lex
        working-directory: lex-ocpp
        run: |
          out=$(lex run tests/test_security.lex run_all)
          echo "test_security.lex: $out failure(s)"
          [ "$out" = "0" ] || { echo "::error::test_security reported $out failure(s)"; exit 1; }

      # Effect-flavoured suite in tests/effectful/ -- kept separate
      # because lex test is non-recursive.
      - name: Run effectful test suite
        working-directory: lex-ocpp
        run: |
          out=$(lex run --allow-effects io,sql,time \
            tests/effectful/test_route_io.lex run_all)
          echo "test_route_io.lex: $out"
          [ "$out" = "0" ] || { echo "::error::test_route_io reported $out failure(s)"; exit 1; }

      # Belt-and-braces: every file under tools/ and examples/.
      - name: Type-check tools/ + examples/
        working-directory: lex-ocpp
        run: |
          set -e
          for f in $(find tools examples -name '*.lex' | sort); do
            echo "=== $f ==="
            lex check "$f"
          done

      - name: Smoke-run charger frame demo
        working-directory: lex-ocpp
        run: lex run --allow-effects io examples/charger_frames.lex main | head -10

      - name: Smoke-run codegen demo
        working-directory: lex-ocpp
        run: lex run tools/gen.lex demo | head -5
